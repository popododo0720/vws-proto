version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
    # FILE's FIELD_NO_DELETE is skipped in the two files below, so these keep an
    # unreserved field deletion there failing.
    - FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED
    - FIELD_NO_DELETE_UNLESS_NAME_RESERVED
  # v1.0.0 release exception (docs/release.md, "v1.0.0"). It covers only the approved
  # deletions: the three removed packages (14 files) and the two `node` fields in the
  # two files below. Remove both blocks in the first minor after v1.0.0.
  ignore:
    - vws/compute
    - vws/storage
    - vws/network
  ignore_only:
    FIELD_NO_DELETE:
      - vws/common/v1/resource.proto
      - vws/common/v1/error.proto
deps:
  - buf.build/googleapis/googleapis
