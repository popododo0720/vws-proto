syntax = "proto3";

package vws.iam.v1;

import "google/api/field_behavior.proto";

option go_package = "github.com/popododo0720/vws-proto/gen/go/vws/iam/v1;iamv1";
option java_multiple_files = true;
option java_outer_classname = "SimulateProto";
option java_package = "dev.vws.iam.v1";

// Shared types for SimulatePrincipalPolicy and SimulateCustomPolicy.
// SimulateCustomPolicy uses the same messages.

// ContextKeyType is AWS ContextKeyTypeEnum.
enum ContextKeyType {
  CONTEXT_KEY_TYPE_UNSPECIFIED = 0;
  CONTEXT_KEY_TYPE_STRING = 1; // string
  CONTEXT_KEY_TYPE_STRING_LIST = 2; // stringList
  CONTEXT_KEY_TYPE_NUMERIC = 3; // numeric
  CONTEXT_KEY_TYPE_NUMERIC_LIST = 4; // numericList
  CONTEXT_KEY_TYPE_BOOLEAN = 5; // boolean
  CONTEXT_KEY_TYPE_BOOLEAN_LIST = 6; // booleanList
  CONTEXT_KEY_TYPE_IP = 7; // ip
  CONTEXT_KEY_TYPE_IP_LIST = 8; // ipList
  CONTEXT_KEY_TYPE_BINARY = 9; // binary
  CONTEXT_KEY_TYPE_BINARY_LIST = 10; // binaryList
  CONTEXT_KEY_TYPE_DATE = 11; // date
  CONTEXT_KEY_TYPE_DATE_LIST = 12; // dateList
}

// PolicyEvaluationDecision is AWS PolicyEvaluationDecisionType.
enum PolicyEvaluationDecision {
  POLICY_EVALUATION_DECISION_UNSPECIFIED = 0;
  POLICY_EVALUATION_DECISION_ALLOWED = 1; // allowed
  POLICY_EVALUATION_DECISION_EXPLICIT_DENY = 2; // explicitDeny
  POLICY_EVALUATION_DECISION_IMPLICIT_DENY = 3; // implicitDeny
}

// PolicySourceType is AWS PolicySourceType.
enum PolicySourceType {
  POLICY_SOURCE_TYPE_UNSPECIFIED = 0;
  POLICY_SOURCE_TYPE_USER = 1; // user
  POLICY_SOURCE_TYPE_GROUP = 2; // group
  POLICY_SOURCE_TYPE_ROLE = 3; // role
  POLICY_SOURCE_TYPE_AWS_MANAGED = 4; // aws-managed
  POLICY_SOURCE_TYPE_USER_MANAGED = 5; // user-managed
  POLICY_SOURCE_TYPE_RESOURCE = 6; // resource
  POLICY_SOURCE_TYPE_NONE = 7; // none
}

// ContextEntry is an AWS ContextEntry: one context key and its values.
message ContextEntry {
  // AWS ContextKeyName, 5-256 characters.
  string context_key_name = 1;
  // AWS ContextKeyType.
  ContextKeyType context_key_type = 2;
  // AWS ContextKeyValues. Each value must match context_key_type.
  repeated string context_key_values = 3;
}

// Position is a line and column in a policy document, for vws-iam#254.
message Position {
  int32 line = 1;
  int32 column = 2;
}

// Statement is an AWS Statement that matched an evaluation.
message Statement {
  string source_policy_id = 1;
  PolicySourceType source_policy_type = 2;
  Position start_position = 3;
  Position end_position = 4;
}

// ResourceSpecificResult is an AWS ResourceSpecificResult.
message ResourceSpecificResult {
  string eval_resource_name = 1;
  PolicyEvaluationDecision eval_resource_decision = 2;
  repeated Statement matched_statements = 3;
  repeated string missing_context_values = 4;
  // AWS PermissionsBoundaryDecisionDetail.AllowedByPermissionsBoundary.
  // Unset when there is no boundary.
  optional bool allowed_by_permissions_boundary = 5;
}

// EvaluationResult is an AWS EvaluationResult.
message EvaluationResult {
  string eval_action_name = 1;
  string eval_resource_name = 2;
  PolicyEvaluationDecision eval_decision = 3;
  repeated Statement matched_statements = 4;
  repeated string missing_context_values = 5;
  // AWS PermissionsBoundaryDecisionDetail.AllowedByPermissionsBoundary.
  // Unset when there is no boundary.
  optional bool allowed_by_permissions_boundary = 6;
  repeated ResourceSpecificResult resource_specific_results = 7;
}

// SimulatePrincipalPolicyRequest is AWS SimulatePrincipalPolicy.
message SimulatePrincipalPolicyRequest {
  // projects/{project}. The project id follows ResourceId.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  // AWS PolicySourceArn, 20-2048 characters, a user, group or role ARN
  // of the parent project.
  string policy_source_arn = 2 [(google.api.field_behavior) = REQUIRED];
  // AWS ActionNames. At least one entry, each 3-128 characters.
  repeated string action_names = 3 [(google.api.field_behavior) = REQUIRED];
  // AWS ResourceArns, each 1-2048 characters. Empty means "*".
  repeated string resource_arns = 4;
  // AWS PolicyInputList, each 1-131072 characters of
  // [\u0009\u000A\u000D\u0020-\u00FF], plain JSON.
  repeated string policy_input_list = 5;
  // AWS PermissionsBoundaryPolicyInputList, same pattern, at most one.
  repeated string permissions_boundary_policy_input_list = 6;
  // AWS CallerArn, 1-2048 characters, a user, group or role ARN.
  string caller_arn = 7;
  // AWS ContextEntries. A duplicate context key, or a value not of its
  // type, is InvalidInput.
  repeated ContextEntry context_entries = 8;
  // AWS Marker, 1-320 characters of [\u0020-\u00FF]. Only a marker this
  // RPC returned.
  string marker = 9;
  // AWS MaxItems, 1-1000. 0 means not set: the server default is 100, as
  // in AWS. console-api answers an explicit MaxItems=0 as ValidationError
  // itself, since 0 cannot be told apart from unset here.
  int32 max_items = 10;
  // resource_policy, resource_owner, resource_handling_option and
  // policy_exclusion_list are reserved (vws-iam#253).
  reserved 11, 12, 13, 14;
  reserved "resource_policy", "resource_owner", "resource_handling_option", "policy_exclusion_list";
}

message SimulatePrincipalPolicyResponse {
  repeated EvaluationResult evaluation_results = 1;
  // AWS IsTruncated.
  bool is_truncated = 2;
  // AWS Marker. Set exactly when is_truncated is true.
  string marker = 3;
}

// SimulateCustomPolicyRequest is AWS SimulateCustomPolicy.
message SimulateCustomPolicyRequest {
  // projects/{project}. The project id follows ResourceId.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  // AWS PolicyInputList. At least one entry, each 1-131072 characters of
  // [\u0009\u000A\u000D\u0020-\u00FF], plain JSON.
  repeated string policy_input_list = 2 [(google.api.field_behavior) = REQUIRED];
  // AWS PermissionsBoundaryPolicyInputList, same pattern, at most one.
  repeated string permissions_boundary_policy_input_list = 3;
  // AWS ActionNames. At least one entry, each 3-128 characters.
  repeated string action_names = 4 [(google.api.field_behavior) = REQUIRED];
  // AWS ResourceArns, each 1-2048 characters. Empty means "*".
  repeated string resource_arns = 5;
  // AWS ResourcePolicy, 1-131072 characters of the same pattern as
  // policy_input_list. InvalidInput until vws-iam#257.
  string resource_policy = 6;
  // AWS ResourceOwner, 1-2048 characters, must be
  // arn:vws:iam::<account>:root when set.
  string resource_owner = 7;
  // AWS ResourceHandlingOption, 1-64 characters. InvalidInput until
  // vws-iam#257.
  string resource_handling_option = 8;
  // AWS CallerArn, 1-2048 characters, a user, group or role ARN.
  string caller_arn = 9;
  // AWS ContextEntries. A duplicate context key, or a value not of its
  // type, is InvalidInput.
  repeated ContextEntry context_entries = 10;
  // AWS Marker, 1-320 characters of [\u0020-\u00FF]. Only a marker this
  // RPC returned.
  string marker = 11;
  // AWS MaxItems, 1-1000. 0 means not set: the server default is 100, as
  // in AWS. console-api answers an explicit MaxItems=0 as ValidationError
  // itself, since 0 cannot be told apart from unset here.
  int32 max_items = 12;
  // ordered_organization_policy_input_list is reserved: VWS has no
  // organizations (vws-iam#257).
  reserved 13;
  reserved "ordered_organization_policy_input_list";
}

message SimulateCustomPolicyResponse {
  repeated EvaluationResult evaluation_results = 1;
  // AWS IsTruncated.
  bool is_truncated = 2;
  // AWS Marker. Set exactly when is_truncated is true.
  string marker = 3;
}
