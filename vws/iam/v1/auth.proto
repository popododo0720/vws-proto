syntax = "proto3";

package vws.iam.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/popododo0720/vws-proto/gen/go/vws/iam/v1;iamv1";
option java_multiple_files = true;
option java_outer_classname = "AuthProto";
option java_package = "dev.vws.iam.v1";

// AuthService is the cluster-internal authentication and authorization API
// for VWS services (console-api first). Only callers allowed by the chart's
// NetworkPolicy reach it; it is never exposed outside the cluster, so it has
// no HTTP routes (no google.api.http): gRPC only.
// None of these RPCs is an operation: they write no desired state.
service AuthService {
  // Authenticate verifies a SigV4 signature inside vws-iam. The caller
  // (console-api) builds the string to sign from the request and sends it
  // with the signature; the secret never leaves vws-iam. Long-term (AKIA)
  // and temporary (ASIA, with session_token) keys both verify.
  // Unknown or inactive key, wrong signature, or a credential scope that does
  // not match the string to sign is UNAUTHENTICATED / INVALID_CREDENTIALS; an
  // expired temporary key is UNAUTHENTICATED / TOKEN_EXPIRED.
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);

  // Authorize evaluates the principal's policies for one request.
  // AWS semantics: an explicit Deny wins, then an Allow, else implicit deny.
  // A denial is a normal response (decision DENY_*), not an RPC error.
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);

  // Login checks a console password and, when the user has an enabled MFA
  // device, its code. A wrong password or code is UNAUTHENTICATED /
  // INVALID_CREDENTIALS; a missing code for an enrolled user is
  // UNAUTHENTICATED / MFA_REQUIRED. The response session_token backs the
  // HttpOnly console cookie.
  rpc Login(LoginRequest) returns (LoginResponse);

  // ValidateSession resolves a console session token. Expired is
  // UNAUTHENTICATED / TOKEN_EXPIRED, unknown or revoked is
  // UNAUTHENTICATED / INVALID_CREDENTIALS.
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);

  // Logout revokes a console session. Revoking an unknown or expired token
  // succeeds (idempotent).
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

// TokenService is STS: temporary credentials. Cluster-internal like
// AuthService, gRPC only, no HTTP routes.
//
// The caller is never taken from the request. vws-iam derives it from the
// credential the client authenticated with (sigv4 or console_session_token)
// and verifies that credential itself. A request without one is
// UNAUTHENTICATED / INVALID_CREDENTIALS. The deprecated caller field is
// ignored: trusting it would let any client that reaches this service act as
// any principal (impersonation). AssumeRoleWithSAML and
// AssumeRoleWithWebIdentity are the exceptions: they take no caller
// credential, and the signed SAML response or OIDC ID token is the
// authentication.
service TokenService {
  // AssumeRole needs the role's trust policy to allow the caller and the
  // caller's identity policies to allow sts:AssumeRole on the role ARN;
  // otherwise PERMISSION_DENIED / ACCESS_DENIED. MFA conditions in either
  // policy see mfa_authenticated of the caller.
  rpc AssumeRole(AssumeRoleRequest) returns (AssumeRoleResponse);

  // GetSessionToken returns temporary credentials for a user, MFA-marked
  // when serial_number and token_code verify. Only a long-term key or the
  // root user may call it.
  rpc GetSessionToken(GetSessionTokenRequest) returns (GetSessionTokenResponse);

  // DecodeAuthorizationMessage is AWS STS DecodeAuthorizationMessage: it
  // opens an AuthorizeResponse.encoded_message for an authorized caller.
  // The caller needs sts:DecodeAuthorizationMessage on "*", checked before
  // the message is opened; otherwise PERMISSION_DENIED / ACCESS_DENIED
  // (AccessDenied). A SigV4 request signed for another action is
  // AccessDenied, and a replayed one is refused as for AssumeRole. No
  // authentication is UNAUTHENTICATED / INVALID_CREDENTIALS
  // (MissingAuthenticationToken). Read only and idempotent: a repeat
  // returns the same JSON.
  rpc DecodeAuthorizationMessage(DecodeAuthorizationMessageRequest) returns (DecodeAuthorizationMessageResponse);

  // GetAccessKeyInfo is AWS STS GetAccessKeyInfo: it returns the project
  // (account) that owns an access key, which may be any project. The caller
  // needs sts:GetAccessKeyInfo on "*", checked before the key is looked up,
  // so a caller without it learns nothing about the key; otherwise
  // PERMISSION_DENIED / ACCESS_DENIED (AccessDenied). A SigV4 request signed
  // for another action is AccessDenied, and a replayed one is refused as for
  // AssumeRole. No authentication is UNAUTHENTICATED / INVALID_CREDENTIALS
  // (MissingAuthenticationToken). An active or inactive key returns its
  // project; a key that does not exist (never created, deleted or not yet
  // active) is NOT_FOUND / RESOURCE_NOT_FOUND (InvalidClientTokenId). Read
  // only and idempotent: a repeat returns the same account.
  rpc GetAccessKeyInfo(GetAccessKeyInfoRequest) returns (GetAccessKeyInfoResponse);

  // GetFederationToken is AWS STS GetFederationToken: temporary credentials
  // for a federated user session named by the request. Only long-term
  // credentials of an IAM user or the root user may call it; a console
  // session, a session token, an assumed-role or a federated caller is
  // PERMISSION_DENIED / ACCESS_DENIED (AccessDenied). The caller needs
  // sts:GetFederationToken on the federated-user ARN. A SigV4 request signed
  // for another action is AccessDenied, and a replayed one is refused as for
  // AssumeRole. No authentication is UNAUTHENTICATED / INVALID_CREDENTIALS
  // (MissingAuthenticationToken). Validation errors are on the request
  // fields. The session's permissions are the intersection of the caller's
  // policies and the session policies; no session policy means no
  // permissions. A federated session cannot call IAM or STS except
  // GetCallerIdentity. Nothing is stored: each call issues new credentials.
  rpc GetFederationToken(GetFederationTokenRequest) returns (GetFederationTokenResponse);

  // AssumeRoleWithSAML is AWS STS AssumeRoleWithSAML: temporary credentials
  // for role_arn from a SAML 2.0 response of the identity provider
  // principal_arn. No caller credential: vws-iam verifies the response
  // signature against the provider's certificates. Validation errors are on
  // the request fields. A response that is not base64 or XML, is unsigned,
  // is signed by a certificate the provider does not list, holds more than
  // one assertion, is addressed to another audience, recipient or
  // destination, comes from another issuer, lacks the Role or
  // RoleSessionName attribute, or names an unknown SAML provider is
  // INVALID_ARGUMENT / INVALID_SPEC (InvalidIdentityToken). An expired
  // assertion (Conditions or SubjectConfirmationData NotOnOrAfter, or
  // SessionNotOnOrAfter) is UNAUTHENTICATED / TOKEN_EXPIRED (ExpiredToken).
  // A response whose status is not Success is PERMISSION_DENIED /
  // ACCESS_DENIED (IDPRejectedClaim). A Role attribute that does not grant
  // the (role_arn, principal_arn) pair, an unknown role, or a trust policy
  // that does not allow sts:AssumeRoleWithSAML for the Federated provider is
  // PERMISSION_DENIED / ACCESS_DENIED (AccessDenied). The session's
  // permissions are the role's policies, intersected with the session
  // policies when any are given. Nothing is stored: each call issues new
  // credentials, and a repeat with the same unexpired response issues
  // another session, as in AWS.
  rpc AssumeRoleWithSAML(AssumeRoleWithSAMLRequest) returns (AssumeRoleWithSAMLResponse);

  // AssumeRoleWithWebIdentity is AWS STS AssumeRoleWithWebIdentity:
  // temporary credentials for role_arn from an OIDC ID token (a JWT). No
  // caller credential: vws-iam verifies the token signature against the
  // JWKS of the OIDC provider for the token's issuer in the role's project.
  // Validation errors are on the request fields. A token that is not a
  // compact JWS, uses an algorithm other than RS256, RS384, RS512, ES256,
  // ES384 or ES512, has a bad signature, comes from an issuer with no OIDC
  // provider in the project, has no audience in the provider's client id
  // list, has a non-integer exp, nbf or iat, or an nbf or iat in the future,
  // or a request with provider_id, is INVALID_ARGUMENT / INVALID_SPEC
  // (InvalidIdentityToken). An expired token (exp) is UNAUTHENTICATED /
  // TOKEN_EXPIRED (ExpiredToken). A provider whose JWKS cannot be fetched is
  // UNAVAILABLE / RECONCILIATION_FAILED with retryable=true
  // (IDPCommunicationError). An unknown role, or a trust policy that does
  // not allow sts:AssumeRoleWithWebIdentity for the Federated provider, is
  // PERMISSION_DENIED / ACCESS_DENIED (AccessDenied). The session's
  // permissions are the role's policies, intersected with the session
  // policies when any are given. Nothing is stored: each call issues new
  // credentials, and a repeat with the same unexpired token issues another
  // session, as in AWS.
  rpc AssumeRoleWithWebIdentity(AssumeRoleWithWebIdentityRequest) returns (AssumeRoleWithWebIdentityResponse);
}

// Principal is the authenticated caller, as resolved by vws-iam.
message Principal {
  PrincipalType type = 1;
  // arn:vws:iam::{project}:root, arn:vws:iam::{project}:user{path}{user},
  // arn:vws:sts::{project}:assumed-role/{role}/{session}, or
  // arn:vws:sts::{project}:federated-user/{name}.
  string arn = 2;
  // Project (AWS account id equivalent).
  string project = 3;
  // AIDA... for a user, AROA...:{session} for an assumed role,
  // {project}:{name} for a federated user.
  string unique_id = 4;
  // The user or role resource name, projects/{project}/users/{user} or
  // projects/{project}/roles/{role}. Empty for root. For a federated user,
  // the IAM user that called GetFederationToken (empty when root did).
  string resource = 5 [(google.api.resource_reference).type = "*"];
  // Session name of an assumed role.
  string session_name = 6;
  // aws:MultiFactorAuthPresent.
  bool mfa_authenticated = 7;
  // aws:MultiFactorAuthAge is computed from this.
  google.protobuf.Timestamp auth_time = 8;
  // Opaque, sealed by vws-iam: the session as Authenticate sealed it (session
  // identity, revocation state, SAML identity (saml:sub, saml:sub_type,
  // saml:namequalifier), and the session policies of a temporary session
  // (federated user, assumed role)), bound to its arn, unique_id, project and
  // expiry, not only its session policies. Authenticate sets it when it
  // resolves the session's credentials; the gateway passes the principal to
  // Authorize unchanged and never builds or reads it. Authorize opens it,
  // checks the session for revocation, restores the SAML keys, and allows only
  // what both the principal's policies and the session policies allow. A
  // principal whose type is FEDERATED_USER or ASSUMED_ROLE, or whose arn is a
  // federated-user or assumed-role ARN, without it, or with one that does not
  // open, has expired, or is bound to another arn, unique_id or project, is
  // DENY_IMPLICIT (fail closed). For a root, user or GetSessionToken principal
  // it seals only the credential type (no session policies) and binds it to
  // the credential that produced it: the access key id when Authenticate
  // resolves a key, the console session when Login or ValidateSession returns
  // the principal. Without it Authorize answers DENY_IMPLICIT, so a caller
  // that drops credential_type and session_context loses access instead of
  // gaining it. Never log it.
  string session_context = 9 [debug_redact = true];
  // The kind of credential vws-iam resolved. Unset means a long-term access
  // key (Authenticate) or a console session (Login, ValidateSession), each
  // with a sealed session_context. Authenticate sets SESSION_TOKEN for a
  // GetSessionToken session and seals the same fact into session_context;
  // Authorize opens session_context and answers DENY_IMPLICIT when
  // credential_type disagrees with it, so a gateway that rewrites the field
  // cannot turn a session into a long-term caller. Authorize applies the AWS
  // limits of a GetSessionToken session: no IAM action without MFA, and no
  // STS action except AssumeRole and GetCallerIdentity.
  CredentialType credential_type = 10;
}

// CredentialType says which credential produced a Principal. Assumed-role and
// federated-user sessions are already told apart by PrincipalType.
enum CredentialType {
  // A long-term access key or a console session.
  CREDENTIAL_TYPE_UNSPECIFIED = 0;
  // A GetSessionToken session of a user or root.
  CREDENTIAL_TYPE_SESSION_TOKEN = 1;
}

enum PrincipalType {
  PRINCIPAL_TYPE_UNSPECIFIED = 0;
  PRINCIPAL_TYPE_ROOT = 1;
  PRINCIPAL_TYPE_USER = 2;
  PRINCIPAL_TYPE_ASSUMED_ROLE = 3;
  // A GetFederationToken session.
  PRINCIPAL_TYPE_FEDERATED_USER = 4;
}

// Credentials are temporary STS credentials.
message Credentials {
  // "ASIA" followed by 16 uppercase letters and digits.
  string access_key_id = 1;
  // Secret: never log it.
  string secret_access_key = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    debug_redact = true
  ];
  // Opaque, HMAC-signed, expiry embedded. Sent as X-Amz-Security-Token.
  // Secret: never log it.
  string session_token = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    debug_redact = true
  ];
  google.protobuf.Timestamp expire_time = 4;
}

// AuthenticateRequest matches console-api internal/sigv4 AuthRequest field for
// field (vws-console-api feat/iam-sigv4-authorize).
message AuthenticateRequest {
  // Access key id from the Credential of the Authorization header.
  string access_key_id = 1 [(google.api.field_behavior) = REQUIRED];
  // yyyymmdd from the credential scope.
  string date = 2 [(google.api.field_behavior) = REQUIRED];
  string region = 3 [(google.api.field_behavior) = REQUIRED];
  // "ec2" or "s3".
  string service = 4 [(google.api.field_behavior) = REQUIRED];
  // SigV4 canonical request. vws-iam hashes it and checks that the hash is
  // the last line of string_to_sign.
  string canonical_request = 5 [(google.api.field_behavior) = REQUIRED];
  // "AWS4-HMAC-SHA256", X-Amz-Date, the scope {date}/{region}/{service}/aws4_request,
  // and the hex SHA-256 of canonical_request, joined by "\n". vws-iam checks
  // that the scope matches date, region, and service, and that X-Amz-Date is
  // within 15 minutes of its clock.
  string string_to_sign = 6 [(google.api.field_behavior) = REQUIRED];
  // Lowercase hex signature from the request.
  string signature = 7 [(google.api.field_behavior) = REQUIRED];
  // X-Amz-Security-Token. Required for an ASIA key, empty for a long-term key.
  // Secret: never log it.
  string session_token = 8 [
    (google.api.field_behavior) = INPUT_ONLY,
    debug_redact = true
  ];
  // Client address, for aws:SourceIp and audit. Optional; console-api does not send it yet.
  string source_ip = 9;
}

// AuthenticateResponse fields 1-3 are what console-api reads (sigv4.Identity).
message AuthenticateResponse {
  // Project (AWS account id equivalent).
  string account = 1;
  // Principal ARN, for example arn:vws:iam::{project}:root.
  string arn = 2;
  bool is_root = 3;
  // Full principal with MFA and session context (mfa_authenticated, auth_time,
  // session_name). Additive; console-api may ignore it.
  Principal principal = 4;
  // Expiry of a temporary key; unset for a long-term key.
  google.protobuf.Timestamp expire_time = 5;
}

message AuthorizeRequest {
  // The caller, as Authenticate, ValidateSession, or an STS call
  // returned it. vws-iam re-reads the policies of principal.resource; it does
  // not trust any other field except mfa_authenticated and auth_time, which
  // it checks against the session or key that produced them,
  // session_context, which it opens and verifies itself, and credential_type,
  // which must agree with session_context.
  Principal principal = 1 [(google.api.field_behavior) = REQUIRED];
  // "<service>:<Action>", for example "ec2:RunInstances" or "s3:PutObject".
  string action = 2 [(google.api.field_behavior) = REQUIRED];
  // Resource ARNs the request touches, arn:vws:<service>:<region>:<project>:<type>/<id>.
  // Empty means "*" (actions without a resource, for example ec2:DescribeInstances).
  // The decision is ALLOW only when every resource is allowed.
  repeated string resources = 3;
  // Condition keys of the request, for example "aws:SourceIp",
  // "aws:RequestedRegion", "aws:CurrentTime", "ec2:InstanceType". The server
  // sets aws:MultiFactorAuthPresent, aws:PrincipalArn, and aws:username itself
  // and ignores those keys here.
  map<string, ContextValues> context = 4;
}

message ContextValues {
  repeated string values = 1;
}

message AuthorizeResponse {
  Decision decision = 1;
  // The statement that decided ALLOW or DENY_EXPLICIT: the policy ARN (or
  // "{owner arn}:inline/{name}") and the statement Sid or index.
  string matched_policy = 2;
  string matched_statement = 3;
  // Short human-readable reason, safe to show in an AccessDenied message.
  string reason = 4;
  // Opaque, encrypted details of a DENY_* decision, for
  // TokenService.DecodeAuthorizationMessage. console-api returns it the way
  // AWS does, for example as the EC2 UnauthorizedOperation "Encoded
  // authorization failure message". Empty on ALLOW. Never log it.
  string encoded_message = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    debug_redact = true
  ];
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_ALLOW = 1;
  DECISION_DENY_EXPLICIT = 2;
  DECISION_DENY_IMPLICIT = 3;
}

message LoginRequest {
  string project = 1 [(google.api.field_behavior) = REQUIRED];
  // IAM user name, or "root" for the account root user.
  string user_name = 2 [(google.api.field_behavior) = REQUIRED];
  // Secret: never log it.
  string password = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY,
    debug_redact = true
  ];
  // Six digits when the user has an enabled MFA device. Never log it.
  string totp_code = 4 [
    (google.api.field_behavior) = INPUT_ONLY,
    debug_redact = true
  ];
  // Client address for aws:SourceIp in later Authorize calls and for audit.
  string source_ip = 5;
}

message LoginResponse {
  // Secret: never log it.
  string session_token = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    debug_redact = true
  ];
  google.protobuf.Timestamp expire_time = 2;
  Principal principal = 3;
  // The console must make the user set a new password before anything else.
  bool password_reset_required = 4;
}

message ValidateSessionRequest {
  // Secret: never log it.
  string session_token = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY,
    debug_redact = true
  ];
}

message ValidateSessionResponse {
  Principal principal = 1;
  google.protobuf.Timestamp expire_time = 2;
}

message LogoutRequest {
  // Secret: never log it.
  string session_token = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY,
    debug_redact = true
  ];
}

message LogoutResponse {}

message AssumeRoleRequest {
  string role = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Role"
  ];
  // Deprecated and ignored: the caller is derived from authentication.
  // Never trust a principal sent by the client (impersonation risk).
  Principal caller = 2 [deprecated = true];
  // [\w+=,.@-]{2,64}.
  string role_session_name = 3 [(google.api.field_behavior) = REQUIRED];
  // 900 to the role's max_session_duration_seconds. Zero means 3600.
  int32 duration_seconds = 4;
  // MFA serial number ARN and its current code, when the trust policy needs MFA.
  string serial_number = 5;
  // Never log it.
  string token_code = 6 [
    (google.api.field_behavior) = INPUT_ONLY,
    debug_redact = true
  ];
  // sts:ExternalId condition value.
  string external_id = 7;
  // How the caller authenticated. vws-iam verifies it and derives the caller
  // from it; required.
  oneof authentication {
    // The SigV4 request of the caller (console-api passes what it would send
    // to Authenticate).
    AuthenticateRequest sigv4 = 8;
    // Console session token, as from Login. Secret: never log it.
    string console_session_token = 9 [debug_redact = true];
  }
}

message AssumeRoleResponse {
  Credentials credentials = 1;
  // The assumed-role principal these credentials resolve to.
  Principal assumed_role_user = 2;
}

message GetSessionTokenRequest {
  // Deprecated and ignored: the caller is derived from authentication.
  // Never trust a principal sent by the client (impersonation risk).
  Principal caller = 1 [deprecated = true];
  // 900 to 129600. Zero means 43200.
  int32 duration_seconds = 2;
  string serial_number = 3;
  // Never log it.
  string token_code = 4 [
    (google.api.field_behavior) = INPUT_ONLY,
    debug_redact = true
  ];
  // How the caller authenticated. vws-iam verifies it and derives the caller
  // from it; required.
  // Only a long-term key (sigv4) or the root user may call it.
  oneof authentication {
    // The SigV4 request of the caller (console-api passes what it would send
    // to Authenticate).
    AuthenticateRequest sigv4 = 5;
    // Console session token, as from Login. Secret: never log it.
    string console_session_token = 6 [debug_redact = true];
  }
}

message GetSessionTokenResponse {
  Credentials credentials = 1;
}

message DecodeAuthorizationMessageRequest {
  // How the caller authenticated. vws-iam verifies it and derives the caller
  // from it; required.
  oneof authentication {
    // The SigV4 request of the caller, signed for
    // DecodeAuthorizationMessage. Its source_ip is aws:SourceIp.
    AuthenticateRequest sigv4 = 1;
    // Console session token, as from Login. Secret: never log it.
    string console_session_token = 2 [debug_redact = true];
  }
  // AWS EncodedMessage, 1-10240 characters. Empty or longer is
  // INVALID_ARGUMENT / INVALID_SPEC (ValidationError). A malformed,
  // tampered, expired, other-project or unknown-key message is
  // INVALID_ARGUMENT / INVALID_SPEC (InvalidAuthorizationMessageException,
  // HTTP 400). Never log it.
  string encoded_message = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY,
    debug_redact = true
  ];
  // Client IP of the current request, set by the gateway (console-api) from
  // the connection it observed, never from a client-supplied value. On the
  // console_session_token path vws-iam uses it as aws:SourceIp, not the IP
  // stored at Login. Empty means unknown: the key is absent.
  string source_ip = 4;
}

message DecodeAuthorizationMessageResponse {
  // AWS DecodedMessage: the JSON document {"allowed", "explicitDeny",
  // "matchedStatements": {"items": [...]}, "failures": {"items": [...]},
  // "context": {"principal": {"id", "name", "arn"}, "action", "resource",
  // "conditions": {"items": [{"key", "values": {"items": [{"value"}]}}]}}}.
  // Never log it.
  string decoded_message = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    debug_redact = true
  ];
}

message GetAccessKeyInfoRequest {
  // How the caller authenticated. vws-iam verifies it and derives the caller
  // from it; required.
  oneof authentication {
    // The SigV4 request of the caller, signed for GetAccessKeyInfo. Its
    // source_ip is aws:SourceIp.
    AuthenticateRequest sigv4 = 1;
    // Console session token, as from Login. Secret: never log it.
    string console_session_token = 2 [debug_redact = true];
  }
  // AWS AccessKeyId, 16-128 characters of [\w]. Shorter, longer or with
  // another character is INVALID_ARGUMENT / INVALID_SPEC (ValidationError).
  string access_key_id = 3 [(google.api.field_behavior) = REQUIRED];
  // Client IP of the current request, set by the gateway (console-api) from
  // the connection it observed, never from a client-supplied value. On the
  // console_session_token path vws-iam uses it as aws:SourceIp, not the IP
  // stored at Login. Empty means unknown: the key is absent.
  string source_ip = 4;
}

message GetAccessKeyInfoResponse {
  // AWS Account: the project (account) id that owns the access key.
  string account = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetFederationTokenRequest {
  // How the caller authenticated. vws-iam verifies it and derives the caller
  // from it; required. Only a long-term key (sigv4) may call it: a console
  // session is AccessDenied, as for GetSessionToken.
  oneof authentication {
    // The SigV4 request of the caller, signed for GetFederationToken. Its
    // source_ip is aws:SourceIp.
    AuthenticateRequest sigv4 = 1;
    // Console session token, as from Login. Refused. Secret: never log it.
    string console_session_token = 2 [debug_redact = true];
  }
  // AWS Name: 2-32 characters of [\w+=,.@-]. Otherwise INVALID_ARGUMENT /
  // INVALID_SPEC (ValidationError).
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  // 900 to 129600. Zero means 43200. A root caller's session is capped at
  // 3600. Outside the range is INVALID_ARGUMENT / INVALID_SPEC
  // (ValidationError).
  int32 duration_seconds = 4;
  // AWS Policy: inline session policy JSON, 1-2048 characters of
  // [\u0009\u000A\u000D\u0020-\u00FF]. Empty means none. A wrong length or
  // character is INVALID_ARGUMENT / INVALID_SPEC (ValidationError); a
  // document that does not parse is INVALID_ARGUMENT / INVALID_SPEC
  // (MalformedPolicyDocument). Do not log it.
  string policy = 5 [
    (google.api.field_behavior) = INPUT_ONLY,
    debug_redact = true
  ];
  // AWS PolicyArns.member.N.arn: at most 10, each 20-2048 characters, each a
  // managed policy of the caller's project. More than 10 or a wrong length is
  // INVALID_ARGUMENT / INVALID_SPEC (ValidationError); an ARN that is not an
  // existing managed policy of the project is INVALID_ARGUMENT / INVALID_SPEC
  // (MalformedPolicyDocument). The plaintext of policy plus every
