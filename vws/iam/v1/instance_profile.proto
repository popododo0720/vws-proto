syntax = "proto3";

package vws.iam.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "vws/common/v1/resource.proto";
import "vws/iam/v1/role.proto";

option go_package = "github.com/popododo0720/vws-proto/gen/go/vws/iam/v1;iamv1";
option java_multiple_files = true;
option java_outer_classname = "InstanceProfileProto";
option java_package = "dev.vws.iam.v1";

// InstanceProfileService manages IAM instance profiles, AWS's container for
// the one role an instance runs as.
service InstanceProfileService {
  // GetInstanceProfile is AWS GetInstanceProfile. It returns the instance
  // profile under its stored name, with status.roles carrying the role it
  // holds (empty when it holds none). Names compare case-insensitively. It
  // only reads.
  // An instance profile name length or pattern fault is INVALID_ARGUMENT /
  // INVALID_SPEC (AWS ValidationError). An unknown instance profile is
  // NOT_FOUND / RESOURCE_NOT_FOUND (NoSuchEntity).
  // Authorization (iam:GetInstanceProfile) is console-api's.
  // AIP-131: the Get response is the resource.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc GetInstanceProfile(GetInstanceProfileRequest) returns (InstanceProfile) {
    option (google.api.http) = {get: "/v1/{name=projects/*/instanceProfiles/*}"};
  }

  // AddRoleToInstanceProfile is AWS AddRoleToInstanceProfile. It adds the
  // role to the instance profile. It is synchronous and not an operation, as
  // the AWS call is: one conditional store write, returned once stored.
  // An instance profile name or RoleName length or pattern fault is
  // INVALID_ARGUMENT / INVALID_SPEC (AWS ValidationError). An unknown
  // instance profile or an unknown role is NOT_FOUND / RESOURCE_NOT_FOUND
  // (NoSuchEntity). A profile that already holds a role, the same role
  // included, is RESOURCE_EXHAUSTED / QUOTA_EXCEEDED (LimitExceeded): one
  // role per instance profile, a fixed AWS quota. A service-linked role is
  // FAILED_PRECONDITION / UNMODIFIABLE_ENTITY (UnmodifiableEntity). A write
  // that keeps losing to concurrent writes is ABORTED / GENERATION_CONFLICT
  // (ConcurrentModification).
  // A repeat after success is RESOURCE_EXHAUSTED (LimitExceeded), as in AWS.
  // Authorization (iam:AddRoleToInstanceProfile and iam:PassRole on the
  // role) is console-api's.
  rpc AddRoleToInstanceProfile(AddRoleToInstanceProfileRequest) returns (AddRoleToInstanceProfileResponse) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/instanceProfiles/*}:addRole"
      body: "*"
    };
  }

  // RemoveRoleFromInstanceProfile is AWS RemoveRoleFromInstanceProfile. It
  // removes the role from the instance profile; the role and the profile
  // stay. It is synchronous and not an operation, as the AWS call is: one
  // conditional store write, returned once stored.
  // An instance profile name or RoleName length or pattern fault is
  // INVALID_ARGUMENT / INVALID_SPEC (AWS ValidationError). An unknown
  // instance profile, an unknown role, or a role that is not in the profile
  // is NOT_FOUND / RESOURCE_NOT_FOUND (NoSuchEntity). A service-linked role
  // is FAILED_PRECONDITION / UNMODIFIABLE_ENTITY (UnmodifiableEntity). A
  // write that keeps losing to concurrent writes is ABORTED /
  // GENERATION_CONFLICT (ConcurrentModification).
  // A repeat after success is NOT_FOUND (NoSuchEntity), as in AWS.
  // Authorization (iam:RemoveRoleFromInstanceProfile) is console-api's.
  rpc RemoveRoleFromInstanceProfile(RemoveRoleFromInstanceProfileRequest) returns (RemoveRoleFromInstanceProfileResponse) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/instanceProfiles/*}:removeRole"
      body: "*"
    };
  }

  // ListInstanceProfilesForRole is AWS ListInstanceProfilesForRole. It lists
  // the instance profiles of the parent project that hold the role, in pages
  // ordered by case-folded name. It only reads.
  // A role_name, page_size or page_token length or pattern fault is
  // INVALID_ARGUMENT / INVALID_SPEC (AWS ValidationError). A well-formed
  // page_token this RPC did not return is INVALID_ARGUMENT / INVALID_SPEC
  // (InvalidInput). An unknown role is NOT_FOUND / RESOURCE_NOT_FOUND
  // (NoSuchEntity). A role in no instance profile is an empty, complete page.
  // Authorization (iam:ListInstanceProfilesForRole) is console-api's.
  rpc ListInstanceProfilesForRole(ListInstanceProfilesForRoleRequest) returns (ListInstanceProfilesForRoleResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*}/roles/{role_name}/instanceProfiles"};
  }

  // ListInstanceProfiles is AWS ListInstanceProfiles. It lists the instance
  // profiles of the parent project whose path starts with path_prefix, in
  // pages ordered by case-folded name. It only reads.
  // A path_prefix, page_size or page_token length or pattern fault is
  // INVALID_ARGUMENT / INVALID_SPEC (AWS ValidationError). A well-formed
  // page_token this RPC did not return is INVALID_ARGUMENT / INVALID_SPEC
  // (InvalidInput). No matching profile is an empty, complete page.
  // Authorization (iam:ListInstanceProfiles) is console-api's.
  rpc ListInstanceProfiles(ListInstanceProfilesRequest) returns (ListInstanceProfilesResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*}/instanceProfiles"};
  }
}

// InstanceProfile is an IAM instance profile, AWS's container for the one
// role an instance runs as.
// Fields 1-10 are the shared resource envelope.
message InstanceProfile {
  option (google.api.resource) = {
    type: "vws.iam/InstanceProfile"
    pattern: "projects/{project}/instanceProfiles/{instance_profile}"
    plural: "instanceProfiles"
    singular: "instanceProfile"
  };

  // The instance profile id is AWS InstanceProfileName, 1-128 characters of
  // [\w+=,.@-], unique per project ignoring case.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4
  ];
  int64 generation = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string etag = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  map<string, string> labels = 5;
  InstanceProfileSpec spec = 6 [(google.api.field_behavior) = REQUIRED];
  InstanceProfileStatus status = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message InstanceProfileSpec {
  // AWS Path, "/" when empty.
  string path = 1;
  // The roles the profile holds, full resource names
  // projects/{project}/roles/{role} of the same project, at most one.
  // Changed only by AddRoleToInstanceProfile and
  // RemoveRoleFromInstanceProfile.
  repeated string roles = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message InstanceProfileStatus {
  vws.common.v1.ObservedState observed = 1;
  // arn:vws:iam::{project}:instance-profile{path}{instance_profile}
  string arn = 2;
  // "AIPA" followed by 17 uppercase letters and digits.
  string unique_id = 3;
  // The Role of each spec.roles entry, read with the profile, as AWS
  // InstanceProfile.Roles carries.
  repeated Role roles = 4;
}

message GetInstanceProfileRequest {
  // projects/{project}/instanceProfiles/{instance_profile}. The instance
  // profile id is AWS InstanceProfileName, 1-128 characters of [\w+=,.@-].
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/InstanceProfile"
  ];
}

message ListInstanceProfilesForRoleRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.iam/InstanceProfile"
  ];
  // AWS RoleName, 1-64 characters of [\w+=,.@-]: a role of the parent
  // project.
  string role_name = 2 [(google.api.field_behavior) = REQUIRED];
  // AWS MaxItems, 1-1000. 0 means not set: the server default is 100, as in
  // AWS. console-api answers an explicit MaxItems=0 as ValidationError
  // itself, since 0 cannot be told apart from unset here.
  int32 page_size = 3;
  // AWS Marker, 1-320 characters of [\u0020-\u00FF]. Only a
  // next_page_token this RPC returned.
  string page_token = 4;
}

message ListInstanceProfilesForRoleResponse {
  // Ordered by case-folded name. Every profile that holds the role for the
  // whole listing is returned once.
  repeated InstanceProfile instance_profiles = 1;
  // AWS Marker. Set exactly when the result is truncated (AWS IsTruncated).
  string next_page_token = 2;
}

message ListInstanceProfilesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.iam/InstanceProfile"
  ];
  // AWS PathPrefix, 1-512 characters of \u002F[\u0021-\u007F]*, matched
  // case-sensitively against the start of the path. Empty means not set:
  // "/", every profile, as in AWS.
  string path_prefix = 2;
  // AWS MaxItems, 1-1000. 0 means not set: the server default is 100, as in
  // AWS. console-api answers an explicit MaxItems=0 as ValidationError
  // itself, since 0 cannot be told apart from unset here.
  int32 page_size = 3;
  // AWS Marker, 1-320 characters of [\u0020-\u00FF]. Only a
  // next_page_token this RPC returned.
  string page_token = 4;
}

message ListInstanceProfilesResponse {
  // Ordered by case-folded name. Every profile that matches for the whole
  // listing is returned once.
  repeated InstanceProfile instance_profiles = 1;
  // AWS Marker. Set exactly when the result is truncated (AWS IsTruncated).
  string next_page_token = 2;
}

message AddRoleToInstanceProfileRequest {
  // projects/{project}/instanceProfiles/{instance_profile}. The instance
  // profile id is AWS InstanceProfileName, 1-128 characters of [\w+=,.@-].
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // AWS RoleName, 1-64 characters of [\w+=,.@-]: a role of the instance
  // profile's project.
  string role_name = 2 [(google.api.field_behavior) = REQUIRED];
}

// AddRoleToInstanceProfileResponse is empty, as AWS returns only a request
// id.
message AddRoleToInstanceProfileResponse {}

message RemoveRoleFromInstanceProfileRequest {
  // projects/{project}/instanceProfiles/{instance_profile}. The instance
  // profile id is AWS InstanceProfileName, 1-128 characters of [\w+=,.@-].
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // AWS RoleName, 1-64 characters of [\w+=,.@-]: a role of the instance
  // profile's project.
  string role_name = 2 [(google.api.field_behavior) = REQUIRED];
}

// RemoveRoleFromInstanceProfileResponse is empty, as AWS returns only a
// request id.
message RemoveRoleFromInstanceProfileResponse {}
