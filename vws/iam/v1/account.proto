syntax = "proto3";

package vws.iam.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "vws/iam/v1/policy.proto";

option go_package = "github.com/popododo0720/vws-proto/gen/go/vws/iam/v1;iamv1";
option java_multiple_files = true;
option java_outer_classname = "AccountProto";
option java_package = "dev.vws.iam.v1";

// AccountService holds account-level IAM reads and writes that are not
// tied to one user, group, role or policy resource. Later account-level
// actions (account summary, password policy, and create/list/delete of this
// account alias) belong on this service.
service AccountService {
  // GetAccountAuthorizationDetails is AWS GetAccountAuthorizationDetails.
  // It lists the users, groups, roles and customer managed policies of
  // the parent project with their relationships, in pages, in that order,
  // each by case-folded name. It only reads.
  // A bad parent, an unknown filter value, a max_items outside 1-1000 or
  // a marker character outside [\u0020-\u00FF] is INVALID_ARGUMENT /
  // INVALID_SPEC (AWS ValidationError). A well-formed marker this RPC
  // did not return is INVALID_ARGUMENT / INVALID_SPEC (InvalidInput). All
  // of these are checked before any store access.
  // AWSManagedPolicy selects nothing (AWS managed policies are not
  // modeled). Tags and RoleLastUsed are not modeled yet and are left
  // unset. Documents are plain JSON; URL encoding is console-api's.
  // Any other failure is INTERNAL (ServiceFailure).
  // Authorization (iam:GetAccountAuthorizationDetails) is console-api's.
  rpc GetAccountAuthorizationDetails(GetAccountAuthorizationDetailsRequest) returns (GetAccountAuthorizationDetailsResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*}:getAccountAuthorizationDetails"};
  }

  // GetAccountSummary is AWS GetAccountSummary. It returns the project's
  // entity usage and enforced quotas as the AWS SummaryMap. It only reads.
  // A bad parent is INVALID_ARGUMENT / INVALID_SPEC (AWS ValidationError)
  // before any store access. Any other failure is INTERNAL (ServiceFailure).
  // A key absent from summary_map is not reported and must not be filled
  // with 0.
  // Authorization (iam:GetAccountSummary) is console-api's.
  rpc GetAccountSummary(GetAccountSummaryRequest) returns (GetAccountSummaryResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*}:getAccountSummary"};
  }

  // GetAccountPasswordPolicy is AWS GetAccountPasswordPolicy. It returns
  // the project's custom password policy. It only reads.
  // A bad parent is INVALID_ARGUMENT / INVALID_SPEC (AWS ValidationError)
  // before any store access. An account without a custom policy is
  // NOT_FOUND / RESOURCE_NOT_FOUND (NoSuchEntity: "The Password Policy
  // with domain name <project> cannot be found."). Any other failure is
  // INTERNAL (ServiceFailure).
  // Authorization (iam:GetAccountPasswordPolicy) is console-api's.
  rpc GetAccountPasswordPolicy(GetAccountPasswordPolicyRequest) returns (GetAccountPasswordPolicyResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*}:getAccountPasswordPolicy"};
  }

  // ---------------------------------------------------------------------------
  // Account aliases
  // ---------------------------------------------------------------------------

  // CreateAccountAlias is AWS CreateAccountAlias. It sets the project's
  // account alias. It is synchronous and not an operation, as the AWS
  // call is: one store write, returned once stored.
  // A bad parent or account_alias is INVALID_ARGUMENT / INVALID_SPEC
  // (AWS ValidationError), before any store access. An alias the
  // project already holds, or one another project holds (AWS keeps
  // aliases unique across accounts), is ALREADY_EXISTS /
  // ALREADY_EXISTS (EntityAlreadyExists); a repeat after success is
  // EntityAlreadyExists. A project has one alias; a create with a
  // different alias overwrites the previous one, so LimitExceeded
  // never applies. Persistent contention on the alias claim is
  // ABORTED / GENERATION_CONFLICT (ConcurrentModification). Any other
  // failure is INTERNAL (ServiceFailure).
  // Authorization (iam:CreateAccountAlias) is console-api's.
  rpc CreateAccountAlias(CreateAccountAliasRequest) returns (CreateAccountAliasResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}:createAccountAlias"
      body: "*"
    };
  }

  // DeleteAccountAlias is AWS DeleteAccountAlias. It deletes the
  // project's account alias. It is synchronous and not an operation,
  // as the AWS call is: one store write, returned once stored.
  // A bad parent or account_alias is INVALID_ARGUMENT / INVALID_SPEC
  // (AWS ValidationError), before any store access. An alias the
  // project does not hold (also one held by another project) is
  // NOT_FOUND / RESOURCE_NOT_FOUND (NoSuchEntity); a repeat after
  // success is NoSuchEntity, as in AWS. The delete is conditional on
  // the stored version and retried a bounded number of times;
  // persistent contention is ABORTED / GENERATION_CONFLICT
  // (ConcurrentModification). LimitExceeded never applies to a
  // delete. Any other failure is INTERNAL (ServiceFailure).
  // Authorization (iam:DeleteAccountAlias) is console-api's.
  rpc DeleteAccountAlias(DeleteAccountAliasRequest) returns (DeleteAccountAliasResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}:deleteAccountAlias"
      body: "*"
    };
  }

  // ---------------------------------------------------------------------------
  // Account password policy
  // ---------------------------------------------------------------------------

  // UpdateAccountPasswordPolicy is AWS UpdateAccountPasswordPolicy. It
  // creates or replaces the project's custom password policy. It is
  // synchronous and not an operation, as the AWS call is: one store
  // write, returned once stored.
  // A bad parent or a value outside its AWS range is INVALID_ARGUMENT /
  // INVALID_SPEC (AWS ValidationError), before any store access. An
  // explicit 0 for max_password_age or password_reuse_prevention is a
  // ValidationError, not the default. Omitted parameters take their AWS
  // defaults (length 6, no max age, no reuse prevention, booleans
  // false). A policy that keeps changing between read and write is
  // ABORTED / GENERATION_CONFLICT (ConcurrentModification).
  // NoSuchEntity, LimitExceeded and MalformedPolicyDocument never apply.
  // Any other failure is INTERNAL (ServiceFailure).
  // A repeat that would store the same policy writes nothing and
  // succeeds, so a retry after a lost response succeeds.
  // Authorization (iam:UpdateAccountPasswordPolicy) is console-api's.
  rpc UpdateAccountPasswordPolicy(UpdateAccountPasswordPolicyRequest) returns (UpdateAccountPasswordPolicyResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}:updateAccountPasswordPolicy"
      body: "*"
    };
  }

  // DeleteAccountPasswordPolicy is AWS DeleteAccountPasswordPolicy. It
  // deletes the project's custom password policy. It is synchronous and
  // not an operation, as the AWS call is: one store write, returned once
  // stored.
  // A bad parent is INVALID_ARGUMENT / INVALID_SPEC (AWS ValidationError)
  // before any store access. A project without a custom policy is
  // NOT_FOUND / RESOURCE_NOT_FOUND (NoSuchEntity: "The Password Policy
  // with domain name <project> cannot be found."), so a repeat after
  // success is NoSuchEntity, as in AWS. A policy that keeps changing
  // between read and delete is ABORTED / GENERATION_CONFLICT
  // (ConcurrentModification). LimitExceeded never applies to a delete.
  // Any other failure is INTERNAL (ServiceFailure).
  // Authorization (iam:DeleteAccountPasswordPolicy) is console-api's.
  rpc DeleteAccountPasswordPolicy(DeleteAccountPasswordPolicyRequest) returns (DeleteAccountPasswordPolicyResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}:deleteAccountPasswordPolicy"
      body: "*"
    };
  }
}

message GetAccountAuthorizationDetailsRequest {
  // projects/{project}. The project id follows ResourceId.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  // AWS Filter, each one of User, Role, Group, LocalManagedPolicy,
  // AWSManagedPolicy, case sensitive. Empty means all. Duplicates are
  // allowed. AWSManagedPolicy selects nothing.
  repeated string filter = 2;
  // AWS MaxItems, 1-1000. 0 means not set: the server default is 100, as
  // in AWS. console-api answers an explicit MaxItems=0 as ValidationError
  // itself, since 0 cannot be told apart from unset here.
  int32 max_items = 3;
  // AWS Marker, 1-320 characters of [\u0020-\u00FF]. Only a marker this
  // RPC returned.
  string marker = 4;
}

message GetAccountAuthorizationDetailsResponse {
  // Ordered by case-folded name among the users of this page.
  repeated UserDetail user_detail_list = 1;
  repeated GroupDetail group_detail_list = 2;
  repeated RoleDetail role_detail_list = 3;
  // Customer managed policies of this page, ordered by case-folded name.
  repeated ManagedPolicyDetail policies = 4;
  // AWS IsTruncated.
  bool is_truncated = 5;
  // AWS Marker. Set exactly when is_truncated is true.
  string marker = 6;
}

// UserDetail is an AWS UserDetail.
message UserDetail {
  string path = 1;
  string user_name = 2;
  string user_id = 3;
  string arn = 4;
  google.protobuf.Timestamp create_time = 5;
  repeated PolicyDetail user_policy_list = 6;
  // Group names the user belongs to, as stored, ordered by case-folded
  // name.
  repeated string group_list = 7;
  repeated AttachedPolicy attached_managed_policies = 8;
  // Unset when the user has no permissions boundary.
  AttachedPermissionsBoundary permissions_boundary = 9;
  // Not modeled yet; left empty until that work lands.
  repeated Tag tags = 10;
}

// GroupDetail is an AWS GroupDetail.
message GroupDetail {
  string path = 1;
  string group_name = 2;
  string group_id = 3;
  string arn = 4;
  google.protobuf.Timestamp create_time = 5;
  repeated PolicyDetail group_policy_list = 6;
  repeated AttachedPolicy attached_managed_policies = 7;
}

// RoleDetail is an AWS RoleDetail.
message RoleDetail {
  string path = 1;
  string role_name = 2;
  string role_id = 3;
  string arn = 4;
  google.protobuf.Timestamp create_time = 5;
  // Trust policy, plain JSON.
  string assume_role_policy_document = 6;
  // Instance profiles that hold this role, each with its roles. Named
  // AuthorizationInstanceProfile because InstanceProfile is already the
  // resource envelope in instance_profile.proto.
  repeated AuthorizationInstanceProfile instance_profile_list = 7;
  repeated PolicyDetail role_policy_list = 8;
  repeated AttachedPolicy attached_managed_policies = 9;
  // Unset when the role has no permissions boundary.
  AttachedPermissionsBoundary permissions_boundary = 10;
  // Not modeled yet; left empty until that work lands.
  repeated Tag tags = 11;
  // Unset when last used is unknown. Not modeled yet.
  RoleLastUsed role_last_used = 12;
}

// ManagedPolicyDetail is an AWS ManagedPolicyDetail.
message ManagedPolicyDetail {
  string policy_name = 1;
  string policy_id = 2;
  string arn = 3;
  string path = 4;
  string default_version_id = 5;
  int32 attachment_count = 6;
  int32 permissions_boundary_usage_count = 7;
  bool is_attachable = 8;
  string description = 9;
  google.protobuf.Timestamp create_time = 10;
  google.protobuf.Timestamp update_time = 11;
  // Named AuthorizationPolicyVersion because PolicyVersion is already the
  // resource envelope in policy.proto.
  repeated AuthorizationPolicyVersion policy_version_list = 12;
}

// PolicyDetail is an AWS PolicyDetail: one inline policy.
message PolicyDetail {
  string policy_name = 1;
  // Plain JSON.
  string policy_document = 2;
}

// AttachedPolicy is an AWS AttachedPolicy: one attached managed policy.
message AttachedPolicy {
  string policy_name = 1;
  string policy_arn = 2;
}

// AttachedPermissionsBoundary is an AWS AttachedPermissionsBoundary.
// permissions_boundary_type is Policy when the message is set.
message AttachedPermissionsBoundary {
  string permissions_boundary_type = 1;
  string permissions_boundary_arn = 2;
}

// RoleLastUsed is an AWS RoleLastUsed. The message is unset when unknown.
message RoleLastUsed {
  google.protobuf.Timestamp last_used_time = 1;
  string region = 2;
}

// AuthorizationInstanceProfile is the AWS InstanceProfile data type as
// carried by RoleDetail, not the InstanceProfile resource envelope.
message AuthorizationInstanceProfile {
  string path = 1;
  string instance_profile_name = 2;
  string instance_profile_id = 3;
  string arn = 4;
  google.protobuf.Timestamp create_time = 5;
  // Roles the profile holds (at most one). A slim Role data type, not
  // RoleDetail, so the list does not recurse.
  repeated AuthorizationRole roles = 6;
}

// AuthorizationRole is the AWS Role data type as carried inside
// AuthorizationInstanceProfile, not the Role resource envelope.
message AuthorizationRole {
  string path = 1;
  string role_name = 2;
  string role_id = 3;
  string arn = 4;
  google.protobuf.Timestamp create_time = 5;
  string assume_role_policy_document = 6;
}

// AuthorizationPolicyVersion is the AWS PolicyVersion data type as
// carried by ManagedPolicyDetail, not the PolicyVersion resource
// envelope. document is plain JSON.
message AuthorizationPolicyVersion {
  string document = 1;
  string version_id = 2;
  bool is_default_version = 3;
  google.protobuf.Timestamp create_time = 4;
}

message GetAccountSummaryRequest {
  // projects/{project}. The project id follows ResourceId.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetAccountPasswordPolicyRequest {
  // projects/{project}. The project id follows ResourceId.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetAccountSummaryResponse {
  // AWS SummaryMap: key to value. Keys returned today are Users, Groups,
  // Roles, Policies, InstanceProfiles, MFADevices, MFADevicesInUse,
  // AccountAccessKeysPresent, and the enforced quotas
  // AccessKeysPerUserQuota, AttachedPoliciesPerGroupQuota,
  // AttachedPoliciesPerRoleQuota, AttachedPoliciesPerUserQuota,
  // GroupPolicySizeQuota, GroupsPerUserQuota, PolicySizeQuota,
  // RolePolicySizeQuota, UserPolicySizeQuota, VersionsPerPolicyQuota.
  // A key VWS cannot compute honestly is omitted, never invented as 0.
  map<string, int32> summary_map = 1;
}

message GetAccountPasswordPolicyResponse {
  PasswordPolicy password_policy = 1;
}

// PasswordPolicy is the AWS PasswordPolicy data type.
// max_password_age and password_reuse_prevention use optional presence:
// their AWS range starts at 1, and AWS omits them when they are not set,
// so console-api can omit them from the XML.
message PasswordPolicy {
  // 6-128.
  int32 minimum_password_length = 1;
  bool require_symbols = 2;
  bool require_numbers = 3;
  bool require_uppercase_characters = 4;
  bool require_lowercase_characters = 5;
  bool allow_users_to_change_password = 6;
  bool hard_expiry = 7;
  // True exactly when max_password_age is set and greater than 0.
  bool expire_passwords = 8;
  // 1-1095 days. Unset when passwords never expire.
  optional int32 max_password_age = 9;
  // 1-24. Unset when there is no reuse check.
  optional int32 password_reuse_prevention = 10;
}

// ---------------------------------------------------------------------------
// Account alias messages (#130)
// ---------------------------------------------------------------------------

message CreateAccountAliasRequest {
  // projects/{project}. The project id follows ResourceId.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  // AWS AccountAlias, 3-63 characters of
  // ^[a-z0-9]([a-z0-9]|-(?!-)){1,61}[a-z0-9]$.
  string account_alias = 2 [(google.api.field_behavior) = REQUIRED];
}

// CreateAccountAliasResponse is empty, as AWS returns only
// ResponseMetadata.
message CreateAccountAliasResponse {}

message DeleteAccountAliasRequest {
  // projects/{project}. The project id follows ResourceId.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  // AWS AccountAlias, 3-63 characters of
  // ^[a-z0-9]([a-z0-9]|-(?!-)){1,61}[a-z0-9]$. The alias the project
  // currently holds; a value the project does not hold is NoSuchEntity.
  string account_alias = 2 [(google.api.field_behavior) = REQUIRED];
}

// DeleteAccountAliasResponse is empty, as AWS returns only
// ResponseMetadata.
message DeleteAccountAliasResponse {}

// ---------------------------------------------------------------------------
// Account password policy messages (#135)
// ---------------------------------------------------------------------------

message UpdateAccountPasswordPolicyRequest {
  // projects/{project}. The project id follows ResourceId.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  // 6-128. Unset means the AWS default of 6. AWS has no partial update.
  optional int32 minimum_password_length = 2;
  // 1-1095 days. Unset means passwords never expire. An explicit 0 is
  // ValidationError, not the default.
  optional int32 max_password_age = 3;
  // 1-24. Unset means no reuse check. An explicit 0 is ValidationError,
  // not the default.
  optional int32 password_reuse_prevention = 4;
  bool require_symbols = 5;
  bool require_numbers = 6;
  bool require_uppercase_characters = 7;
  bool require_lowercase_characters = 8;
  bool allow_users_to_change_password = 9;
  bool hard_expiry = 10;
}

// UpdateAccountPasswordPolicyResponse is empty, as AWS returns only
// ResponseMetadata.
message UpdateAccountPasswordPolicyResponse {}

message DeleteAccountPasswordPolicyRequest {
  // projects/{project}. The project id follows ResourceId. AWS
  // DeleteAccountPasswordPolicy has no other request parameters.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
}

// DeleteAccountPasswordPolicyResponse is empty, as AWS returns only
// ResponseMetadata.
message DeleteAccountPasswordPolicyResponse {}
