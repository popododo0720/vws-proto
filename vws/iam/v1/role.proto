syntax = "proto3";

package vws.iam.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "vws/common/v1/resource.proto";
import "vws/iam/v1/policy.proto";

option go_package = "github.com/popododo0720/vws-proto/gen/go/vws/iam/v1;iamv1";
option java_multiple_files = true;
option java_outer_classname = "RoleProto";
option java_package = "dev.vws.iam.v1";

// RoleService manages IAM roles. A role is assumed through
// TokenService.AssumeRole; its trust policy says who may assume it.
// No node reconciles IAM. The server writes the resource and its status
// (observed.state READY, observed.generation = generation) in one store, so
// every operation of this service is returned done.
// Delete is FAILED_PRECONDITION / DEPENDENCY_MISSING while policies are
// attached or inline. Sessions already issued stay valid until they expire.
service RoleService {
  // AIP-131: the Get response is the resource.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc GetRole(GetRoleRequest) returns (Role) {
    option (google.api.http) = {get: "/v1/{name=projects/*/roles/*}"};
  }

  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*}/roles"};
  }

  // AIP-151: every mutation returns google.longrunning.Operation.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreateRole(CreateRoleRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}/roles"
      body: "role"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.Role"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateRole(UpdateRoleRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{role.name=projects/*/roles/*}"
      body: "role"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.Role"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteRole(DeleteRoleRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1/{name=projects/*/roles/*}"};
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.Role"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // RevokeRoleSessions invalidates every STS session issued so far for
  // the role (GetSessionToken for a user, AssumeRole for a role), like
  // the AWS console's "Revoke active sessions". Credentials issued later
  // are unaffected. Callers need iam:RevokeRoleSessions on the role ARN.
  // Re-running moves status.sessions_revoke_time forward; a request_id
  // replay returns the original operation.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc RevokeRoleSessions(RevokeRoleSessionsRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/roles/*}:revokeSessions"
      body: "*"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.Role"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }
  // PutRolePermissionsBoundary is AWS PutRolePermissionsBoundary. It sets
  // spec.permissions_boundary_arn to a managed policy of the role's project,
  // replacing any boundary the role has. The trust and permission policies
  // stay. It is synchronous and not an operation, as the AWS call is: one
  // conditional store write, returned once stored.
  // A RoleName or ARN length or pattern fault is INVALID_ARGUMENT /
  // INVALID_SPEC (AWS ValidationError), and an ARN that is not a managed
  // policy ARN is INVALID_ARGUMENT / INVALID_SPEC (InvalidInput). An unknown
  // role, or a policy that is not a managed policy of the project, is
  // NOT_FOUND / RESOURCE_NOT_FOUND (NoSuchEntity). A service-linked role is
  // FAILED_PRECONDITION / UNMODIFIABLE_ENTITY (UnmodifiableEntity). A write that
  // keeps losing to concurrent writes is ABORTED / GENERATION_CONFLICT
  // (ConcurrentModification).
  // A role that already has this boundary succeeds without a write, so a
  // retry after a lost response succeeds.
  // Authorization (iam:PutRolePermissionsBoundary) is console-api's.
  rpc PutRolePermissionsBoundary(PutRolePermissionsBoundaryRequest) returns (PutRolePermissionsBoundaryResponse) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/roles/*}:putPermissionsBoundary"
      body: "*"
    };
  }
  // DeleteRolePermissionsBoundary is AWS DeleteRolePermissionsBoundary. It
  // clears spec.permissions_boundary_arn. The trust and permission policies
  // stay. It is synchronous and not an operation, as the AWS call is: one
  // conditional store write, returned once stored.
  // A RoleName length or pattern fault is INVALID_ARGUMENT / INVALID_SPEC
  // (AWS ValidationError). An unknown role is NOT_FOUND / RESOURCE_NOT_FOUND
  // (NoSuchEntity). A service-linked role is FAILED_PRECONDITION /
  // UNMODIFIABLE_ENTITY (UnmodifiableEntity). A write that keeps losing to
  // concurrent writes is ABORTED / GENERATION_CONFLICT
  // (ConcurrentModification).
  // A role with no boundary succeeds without a write, so a retry after a
  // lost response succeeds.
  // Authorization (iam:DeleteRolePermissionsBoundary) is console-api's.
  rpc DeleteRolePermissionsBoundary(DeleteRolePermissionsBoundaryRequest) returns (DeleteRolePermissionsBoundaryResponse) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/roles/*}:deletePermissionsBoundary"
      body: "*"
    };
  }

  // DeleteServiceLinkedRole is AWS DeleteServiceLinkedRole. It deletes a
  // service-linked role and returns its deletion task id. It is synchronous
  // and not an operation: the role is deleted from the store when the call
  // returns. GetServiceLinkedRoleDeletionStatus is a separate request.
  // A malformed name or role id is INVALID_ARGUMENT / INVALID_SPEC (AWS
  // ValidationError). A role that does not exist, or one that is not
  // service-linked (created with CreateRole), is NOT_FOUND /
  // RESOURCE_NOT_FOUND (NoSuchEntity).
  // The task id is derived from the role's uid, so concurrent or repeated
  // requests return the same id while the role exists. Once it is deleted a
  // repeat is NOT_FOUND.
  // Authorization (iam:DeleteServiceLinkedRole on the role ARN) is
  // console-api's.
  rpc DeleteServiceLinkedRole(DeleteServiceLinkedRoleRequest) returns (DeleteServiceLinkedRoleResponse) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/roles/*}:deleteServiceLinkedRole"
      body: "*"
    };
  }
  // CreateServiceLinkedRole is AWS CreateServiceLinkedRole. It creates the
  // role a VWS service uses, with path /aws-service-role/{aws_service_name}/,
  // name AWSServiceRoleFor{service role name}[_{custom_suffix}] and a trust
  // policy for the service principal. It is synchronous and not an
  // operation, as the AWS call is: one store write, returned once stored.
  // A length or pattern fault is INVALID_ARGUMENT / INVALID_SPEC (AWS
  // ValidationError). An unknown service principal, a custom_suffix the
  // service does not allow, a resulting role name over 64 characters, or a
  // role name already taken in the project (case folded) is
  // INVALID_ARGUMENT / INVALID_SPEC (InvalidInput), not ALREADY_EXISTS.
  // A repeat after a success is therefore InvalidInput, as in AWS. The role
  // exists and ListRoles finds it.
  // Authorization (iam:CreateServiceLinkedRole, condition key
  // iam:AWSServiceName) is console-api's.
  rpc CreateServiceLinkedRole(CreateServiceLinkedRoleRequest) returns (CreateServiceLinkedRoleResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}/roles:createServiceLinkedRole"
      body: "*"
    };
  }
  // ListRoleTags is AWS ListRoleTags. It lists the tags of the named role,
  // sorted by key, in pages. It only reads.
  // A bad project, a RoleName outside the AWS pattern, a page_size outside
  // 1-1000, or a page_token character outside [\u0020-\u00FF] is
  // INVALID_ARGUMENT / INVALID_SPEC (AWS ValidationError). A well-formed
  // page_token this RPC did not return is INVALID_ARGUMENT / INVALID_SPEC
  // (InvalidInput). All of these are checked before any store access.
  // An unknown role is NOT_FOUND / RESOURCE_NOT_FOUND (NoSuchEntity:
  // "The role with name X cannot be found."). Any other failure is INTERNAL
  // (ServiceFailure).
  // Authorization (iam:ListRoleTags) is console-api's.
  rpc ListRoleTags(ListRoleTagsRequest) returns (ListRoleTagsResponse) {
    option (google.api.http) = {get: "/v1/{name=projects/*/roles/*}:tags"};
  }
  // TagRole is AWS TagRole. It adds or overwrites tags on the named role.
  // The whole request stores nothing when one tag is invalid (key outside
  // 1-128 or value outside 0-256 characters of [\p{L}\p{Z}\p{N}_.:/=+\-@], or
  // either beginning with aws:), the request has more than 50 tags, or the
  // role would keep more than 50 tags: INVALID_ARGUMENT / INVALID_SPEC
  // (InvalidInput), and the 51st tag RESOURCE_EXHAUSTED / QUOTA_EXCEEDED
  // (LimitExceeded). A key that repeats keeps the last value. An unknown role
  // is NOT_FOUND / RESOURCE_NOT_FOUND (NoSuchEntity). The operation is done
  // and idempotent by request_id; its response is the Role.
  // Authorization (iam:TagRole) is console-api's.
  // AIP-151: every mutation returns google.longrunning.Operation.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc TagRole(TagRoleRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/roles/*}:tag"
      body: "*"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.Role"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }
  // UntagRole is AWS UntagRole. It removes the named keys from the role. A
  // key that is not attached is ignored. Errors are those of TagRole
  // (InvalidInput, NoSuchEntity). The operation is done and idempotent by
  // request_id; its response is the Role.
  // Authorization (iam:UntagRole) is console-api's.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UntagRole(UntagRoleRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/roles/*}:untag"
      body: "*"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.Role"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }
}

// Role is an IAM role.
// Fields 1-10 are the shared resource envelope.
message Role {
  option (google.api.resource) = {
    type: "vws.iam/Role"
    pattern: "projects/{project}/roles/{role}"
    plural: "roles"
    singular: "role"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4
  ];
  int64 generation = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string etag = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  map<string, string> labels = 5;
  RoleSpec spec = 6 [(google.api.field_behavior) = REQUIRED];
  RoleStatus status = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message RoleSpec {
  string path = 1;
  // Trust policy (AssumeRolePolicyDocument), JSON. Its statements name
  // principals and the sts:AssumeRole action. Required.
  string assume_role_policy = 2 [(google.api.field_behavior) = REQUIRED];
  // 3600 to 43200. Zero means 3600.
  int32 max_session_duration_seconds = 3;
  repeated string attached_policies = 4;
  // Inline policies: policy name (IamName, 1 to 128 characters as in AWS
  // PutRolePolicy PolicyName) -> JSON policy document.
  map<string, string> inline_policies = 5;
  string description = 6;
  // AWS PermissionsBoundary.PermissionsBoundaryArn, a managed policy ARN
  // arn:vws:iam::{project}:policy{path}{policy}. Empty means no boundary.
  // PermissionsBoundaryType is always PermissionsBoundaryPolicy. Set only by
  // PutRolePermissionsBoundary and cleared only by
  // DeleteRolePermissionsBoundary. CreateRole and UpdateRole do not change it.
  string permissions_boundary_arn = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message RoleStatus {
  vws.common.v1.ObservedState observed = 1;
  // arn:vws:iam::{project}:role{path}{role}
  string arn = 2;
  // "AROA" followed by 17 uppercase letters and digits.
  string unique_id = 3;
  // Sessions issued before this time are refused (RevokeRoleSessions).
  // Unset until the first revocation.
  google.protobuf.Timestamp sessions_revoke_time = 4;
}

message GetRoleRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Role"
  ];
}

message ListRolesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.iam/Role"
  ];
  // Server default is 50. Values above 1000 are coerced to 1000.
  int32 page_size = 2;
  string page_token = 3;
}

message ListRolesResponse {
  repeated Role roles = 1;
  string next_page_token = 2;
}

message CreateRoleRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.iam/Role"
  ];
  // Final path segment. Must match IamName (docs/validation.md): [A-Za-z0-9+=,.@_-], 1 to 64 characters, unique per project ignoring case.
  string role_id = 2 [(google.api.field_behavior) = REQUIRED];
  Role role = 3 [(google.api.field_behavior) = REQUIRED];
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 5 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateRoleRequest {
  Role role = 1 [(google.api.field_behavior) = REQUIRED];
  // Paths are relative to Role. status and output-only fields are rejected.
  // Omitted mask is treated as "spec,labels".
  google.protobuf.FieldMask update_mask = 2;
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
  bool allow_missing = 5 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteRoleRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Role"
  ];
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];
  string etag = 4 [(google.api.field_behavior) = OPTIONAL];
}

message RevokeRoleSessionsRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Role"
  ];
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

message PutRolePermissionsBoundaryRequest {
  // projects/{project}/roles/{role}. The role id is AWS RoleName, 1-64
  // characters of [\w+=,.@-].
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Role"
  ];
  // AWS PermissionsBoundary, 20-2048 characters. A managed policy ARN
  // arn:vws:iam::{project}:policy{path}{policy} of the role's project.
  string permissions_boundary = 2 [(google.api.field_behavior) = REQUIRED];
}

// PutRolePermissionsBoundaryResponse is empty, as AWS returns only a request
// id. GetRole reads the boundary back.
message PutRolePermissionsBoundaryResponse {}

message DeleteRolePermissionsBoundaryRequest {
  // projects/{project}/roles/{role}. The role id is AWS RoleName, 1-64
  // characters of [\w+=,.@-].
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Role"
  ];
}

// DeleteRolePermissionsBoundaryResponse is empty, as AWS returns only a
// request id. GetRole reads the role back.
message DeleteRolePermissionsBoundaryResponse {}

message DeleteServiceLinkedRoleRequest {
  // projects/{project}/roles/{role}. The role id is AWS RoleName, 1-64
  // characters of [\w+=,.@-].
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Role"
  ];
}

message DeleteServiceLinkedRoleResponse {
  // AWS DeletionTaskId,
  // task/aws-service-role/{service-principal}/{role-name}/{uuid}, at most
  // 1000 characters. Derived from the role's uid.
  string deletion_task_id = 1;
}

message CreateServiceLinkedRoleRequest {
  // projects/{project}.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.iam/Role"
  ];
  // AWS AWSServiceName, the service principal, 1-128 characters of
  // [\w+=,.@-], case-sensitive.
  string aws_service_name = 2 [(google.api.field_behavior) = REQUIRED];
  // AWS CustomSuffix, 1-64 characters of [\w+=,.@-]. Empty means absent.
  string custom_suffix = 3 [(google.api.field_behavior) = OPTIONAL];
  // AWS Description, at most 1000 characters of
  // [\u0009\u000A\u000D\u0020-\u007E\u00A1-\u00FF].
  string description = 4 [(google.api.field_behavior) = OPTIONAL];
}

message CreateServiceLinkedRoleResponse {
  // The created role, as AWS CreateServiceLinkedRoleResult.Role.
  Role role = 1;
}

// ListRoleTags is AWS ListRoleTags. It lists a role's tags sorted by key.
message ListRoleTagsRequest {
  // projects/{project}/roles/{role}. The role id is AWS RoleName, 1-64
  // characters of [\w+=,.@-].
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Role"
  ];
  // AWS MaxItems, 1-1000. 0 means not set: the server default is 100, as in
  // AWS. console-api answers an explicit MaxItems=0 as ValidationError
  // itself, since 0 cannot be told apart from unset here.
  int32 page_size = 2;
  // AWS Marker, 1-320 characters of [\u0020-\u00FF]. Only a
  // next_page_token this RPC returned.
  string page_token = 3;
}

message ListRoleTagsResponse {
  // Existing vws.iam.v1.Tag (key, value), sorted by key.
  repeated Tag tags = 1;
  // AWS Marker. Set exactly when the result is truncated (AWS IsTruncated).
  string next_page_token = 2;
}

// TagRole adds or overwrites tags on a role. The whole request fails and
// stores nothing when one tag is invalid, the request has more than 50 tags,
// or the role would keep more than 50 tags. The response is the Role.
message TagRoleRequest {
  // projects/{project}/roles/{role}. The role id is AWS RoleName, 1-64
  // characters of [\w+=,.@-].
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Role"
  ];
  // 1-50 tags (AWS Tags). A tag whose key already exists on the role
  // overwrites it. A key that repeats within one request keeps the last value.
  repeated Tag tags = 2 [(google.api.field_behavior) = REQUIRED];
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// UntagRole removes the named keys from a role. A key that is not attached is
// ignored. The response is the Role.
message UntagRoleRequest {
  // projects/{project}/roles/{role}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Role"
  ];
  // 1-50 keys (AWS TagKeys), 1-128 characters each, same alphabet as Tag.key.
  repeated string tag_keys = 2 [(google.api.field_behavior) = REQUIRED];
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}
