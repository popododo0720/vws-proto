syntax = "proto3";

package vws.compute.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";

option go_package = "github.com/popododo0720/vws-proto/gen/go/vws/compute/v1;computev1";
option java_multiple_files = true;
option java_outer_classname = "OperationLookupProto";
option java_package = "dev.vws.compute.v1";

// OperationLookupService finds the compute operation that a request_id produced.
// A client that lost the operation name (for example after a crash between the
// mutating RPC and saving its reply) uses it instead of resending the mutation.
// Resending fails with ABORTED / IDEMPOTENCY_CONFLICT once the resource changed.
//
// Rules:
//   - The lookup is scoped to parent. The server resolves the caller's project
//     and returns NOT_FOUND when parent is a different project. It never
//     returns PERMISSION_DENIED, so a caller cannot learn whether another
//     project used a request_id.
//   - A request_id is remembered for the same 24 hours as the idempotency rules
//     on vws.common.v1.OperationMetadata. After that the lookup is NOT_FOUND,
//     even if the operation itself is still stored.
//   - The lookup covers every compute mutation (instances, images, key pairs).
//   - An unset or malformed request_id is INVALID_ARGUMENT / INVALID_SPEC.
//     A malformed parent is INVALID_ARGUMENT / INVALID_SPEC.
//   - The lookup is read-only. It never creates, resumes, or cancels an operation.
service OperationLookupService {
  rpc LookupOperation(LookupOperationRequest) returns (LookupOperationResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*}/operations:lookup"};
  }
}

message LookupOperationRequest {
  // The caller's project: "projects/{project}". Operations are its children
  // ("projects/{project}/operations/{operation}").
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "longrunning.googleapis.com/Operation"
  ];
  // The request_id sent on the original mutating RPC.
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = REQUIRED
  ];
}

message LookupOperationResponse {
  // The operation, in the same form GetOperation returns. Its name is
  // "projects/{project}/operations/{operation}" and its metadata is
  // vws.common.v1.OperationMetadata with request_id set.
  google.longrunning.Operation operation = 1;
}
