name: buf

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.55.1"
          github_token: ${{ github.token }}
      - name: buf lint
        run: buf lint
      - name: buf build
        run: buf build
      - name: buf breaking
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}"
          if git ls-tree -r --name-only "origin/${BASE_REF}" | grep -q '\.proto$'; then
            buf breaking --against ".git#branch=origin/${BASE_REF}"
          else
            echo "Base has no proto files. Skipping breaking check."
          fi

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.55.1"
          github_token: ${{ github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: generated Go is current
        run: scripts/check-generated-go.sh
      - name: go build
        run: go build ./...

  guard-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard-agents.sh rejects bad input
        run: scripts/guard-agents.sh selftest

  # English only: tracked files (with .github/english-allowlist), the PR body and the PR's commit messages.
  english:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check-english.sh rejects bad inputs
        run: scripts/check-english.sh selftest
      - name: Tracked files are English
        run: scripts/check-english.sh files
      - name: PR body is English
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-english.sh text
      - name: Commit messages are English
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-english.sh commits "$BASE_SHA" "$HEAD_SHA"
